name: Run Solana Bot Daemon

on:
  workflow_dispatch: # Allows manual trigger to start scanning
  schedule:
    - cron: '0 */6 * * *' # Automatically restarts every 6 hours

jobs:
  run-scanner:
    name: Run Scanner Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub Actions maximum is 360 mins (6 hours)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-run-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-run-

    - name: Restore history file if exists
      uses: actions/cache/restore@v3
      id: history-cache
      with:
        path: alert_history.json
        key: ${{ runner.os }}-alert-history-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-alert-history-

    - name: Create config.json from GitHub Secrets
      run: |
        cat <<EOF > config.json
        {
          "telegram_token": "${{ secrets.TELEGRAM_TOKEN }}",
          "telegram_chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
          "poll_interval_seconds": 60,
          "min_liquidity_usd": 20000.0,
          "min_volume_usd_h1": 5000.0,
          "min_volume_usd_m5": 100.0,
          "min_market_cap_usd": 50000.0,
          "max_pair_age_hours": 24.0,
          "min_buys_m5": 5,
          "min_txns_m5": 5,
          "web_port": 8080
        }
        EOF

    - name: Run Solana DexScreener Scanner
      run: |
        # Pre-build inside the workflow so compilation time doesn't consume runner duration
        cargo build --release
        
        # Run scanner and stop it gracefully 10 mins before the 6-hour GitHub Actions timeout
        timeout 350m ./target/release/solana-dex-scanner || true

    - name: Save updated alert history to GitHub cache
      uses: actions/cache/save@v3
      if: always()
      with:
        path: alert_history.json
        key: ${{ runner.os }}-alert-history-${{ github.run_id }}
