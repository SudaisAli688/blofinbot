name: Solana DexScreener Scanner Bot

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" to start it
  schedule:
    - cron: '0 */6 * * *' # Automatically restarts every 6 hours

jobs:
  run-scanner:
    name: Build and Run Bot
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: 🔍 Auto-Locate Rust Project
      id: locate
      run: |
        # Find the directory containing Cargo.toml automatically
        CARGO_PATH=$(find . -name "Cargo.toml" -print -quit)
        if [ -z "$CARGO_PATH" ]; then
          echo "❌ ERROR: Could not find Cargo.toml anywhere in your repository!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$CARGO_PATH")
        echo "Found Cargo.toml in: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ env.PROJECT_DIR }}/target
        key: ${{ runner.os }}-cargo-run-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-run-

    - name: Restore history file if exists
      uses: actions/cache/restore@v3
      id: history-cache
      with:
        path: ${{ env.PROJECT_DIR }}/alert_history.json
        key: ${{ runner.os }}-alert-history-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-alert-history-

    - name: ⚙️ Create config.json from GitHub Secrets
      run: |
        cat <<EOF > ${{ env.PROJECT_DIR }}/config.json
        {
          "telegram_token": "${{ secrets.TELEGRAM_TOKEN }}",
          "telegram_chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
          "poll_interval_seconds": 15,
          "min_liquidity_usd": 1000.0,
          "min_volume_usd_h1": 500.0,
          "min_volume_usd_m5": 100.0,
          "min_market_cap_usd": 5000.0,
          "max_pair_age_hours": 24.0,
          "min_buys_m5": 0,
          "min_txns_m5": 0,
          "web_port": 8080
        }
        EOF

    - name: 🚀 Compile and Run Scanner
      run: |
        cd ${{ env.PROJECT_DIR }}
        cargo build --release
        timeout 350m ./target/release/solana-dex-scanner || true

    - name: Save updated alert history to GitHub cache
      uses: actions/cache/save@v3
      if: always()
      with:
        path: ${{ env.PROJECT_DIR }}/alert_history.json
        key: ${{ runner.os }}-alert-history-${{ github.run_id }}
